
openapi: 3.1.0

info:
  title: ImmoService API
  version: 1.0.0
  description: API REST de gestion des annonces immobilières.

servers:
  - url: http://localhost:3001
    description: Serveur local

paths:
  /annonces:
    get:
      security: []  # Route publique : aucun JWT nécessaire
      tags:
        - Annonces
      summary: Lister les annonces publiées
      description: >
        Retourne les annonces publiées avec pagination
        et filtres facultatifs. Cette route est publique.
      operationId: listAnnonces

      parameters:
        - name: page
          in: query
          description: Numéro de la page (à partir de 1).
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          description: Nombre d'annonces par page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - name: ville
          in: query
          description: Filtrer les annonces par ville.
          schema:
            type: string
            minLength: 1
            maxLength: 100

        - name: type
          in: query
          description: Type de transaction immobilière.
          schema:
            type: string
            enum: [VENTE, LOCATION]

        - name: prixMax
          in: query
          description: Prix maximal des annonces.
          schema:
            type: number
            minimum: 0

      responses:
        "200":
          description: Liste paginée des annonces publiées.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnonceResume"
                  pagination:
                    type: object
                    required: [page, limit, total, pages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer

        "400":
          description: Paramètres de recherche invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      tags:
        - Annonces
      summary: Créer une annonce immobilière
      description: >
        Permet à un AGENT ou un ADMIN authentifié de créer une annonce.
        L'identifiant de l'auteur est récupéré depuis le JWT.
        Le statut initial est toujours BROUILLON.
      operationId: createAnnonce
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnonceInput"

      responses:
        "201":
          description: Annonce créée en brouillon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnonceCreee"

        "400":
          description: Données de création invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: JWT absent, invalide ou expiré.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "403":
          description: Utilisateur authentifié sans rôle AGENT ou ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "429":
          description: Limite de requêtes dépassée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /annonces/{id}:
    get:
      tags:
        - Annonces
      summary: Consulter le détail d'une annonce publiée
      operationId: getAnnonceById
      security: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'annonce.
          schema:
            type: string
            minLength: 1

      responses:
        "200":
          description: Détails de l'annonce publiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnonceDetail"

        "400":
          description: Identifiant invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "404":
          description: Annonce inexistante ou non publiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateAnnonceInput:
      type: object
      additionalProperties: false
      required:
        - titre
        - description
        - type
        - typePropriete
        - prix
        - ville
        - surface
        - chambres
      properties:
        titre:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        type:
          type: string
          enum: [VENTE, LOCATION]
        typePropriete:
          type: string
          enum: [APPARTEMENT, MAISON, VILLA, STUDIO, LOFT]
        prix:
          type: string
          description: Montant strictement positif, avec au plus deux décimales.
          pattern: '^(?!0(?:\.0{1,2})?$)(0|[1-9]\d{0,9})(\.\d{1,2})?$'
          examples: ["185000.00"]
        ville:
          type: string
          minLength: 1
        surface:
          type: integer
          minimum: 1
          maximum: 2147483647
        chambres:
          type: integer
          minimum: 0
          maximum: 2147483647
        etat:
          type: string
          enum: [DISPONIBLE, LOUE, VENDU]
        dateDisponibilite:
          type: string
          format: date-time
          description: Date ISO 8601 avec fuseau horaire.

    AnnonceCreee:
      allOf:
        - $ref: "#/components/schemas/AnnonceResume"
        - type: object
          required:
            - description
            - statut
            - dateDisponibilite
            - updatedAt
            - auteurId
            - photos
          properties:
            description:
              type: string
            statut:
              type: string
              enum: [BROUILLON]
            surface:
              type: integer
            chambres:
              type: integer
            dateDisponibilite:
              type: [string, "null"]
              format: date-time
            updatedAt:
              type: string
              format: date-time
            auteurId:
              type: string
              description: Identifiant de l'utilisateur authentifié.
            photos:
              type: array
              items:
                type: object
                required: [id, url, alt, annonceId]
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  alt:
                    type: string
                  annonceId:
                    type: string

    AnnonceDetail:
      allOf:
        - $ref: "#/components/schemas/AnnonceResume"
        - type: object
          required:
            - statut
            - auteurId
            - photos
            - updatedAt
          properties:
            description:
              type: [string, "null"]
            statut:
              type: string
              enum: [PUBLIE]
            dateDisponibilite:
              type: [string, "null"]
              format: date-time
            updatedAt:
              type: string
              format: date-time
            auteurId:
              type: string
            photos:
              type: array
              items:
                type: object
                required: [id, url, alt, annonceId]
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  alt:
                    type: string
                  annonceId:
                    type: string

    AnnonceResume:
      type: object
      required:
        - id
        - titre
        - type
        - typePropriete
        - etat
        - prix
        - ville
        - surface
        - chambres
        - createdAt
      properties:
        id:
          type: string
        titre:
          type: string
        type:
          type: string
          enum: [VENTE, LOCATION]
        typePropriete:
          type: string
        etat:
          type: string
        prix:
          type: string
          description: Prix décimal sérialisé en chaîne.
          examples: ["250000.00"]
        ville:
          type: string
        surface:
          type: [number, "null"]
        chambres:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
