
openapi: 3.1.0

info:
  title: ImmoService API
  version: 1.0.0
  description: API REST de gestion des annonces immobilières.

servers:
  - url: http://localhost:3001
    description: Serveur local

paths:
  /annonces:
    get:
      security: []  # Route publique : aucun JWT nécessaire
      tags:
        - Annonces
      summary: Lister les annonces publiées
      description: >
        Retourne les annonces publiées avec pagination
        et filtres facultatifs. Cette route est publique.
      operationId: listAnnonces

      parameters:
        - name: page
          in: query
          description: Numéro de la page (à partir de 1).
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          description: Nombre d'annonces par page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - name: ville
          in: query
          description: Filtrer les annonces par ville.
          schema:
            type: string
            minLength: 1
            maxLength: 100

        - name: type
          in: query
          description: Type de transaction immobilière.
          schema:
            type: string
            enum: [VENTE, LOCATION]

        - name: prixMax
          in: query
          description: >
            Prix maximal sous forme de chaîne décimale non négative,
            avec au plus deux décimales.
          schema:
            type: string
            pattern: '^(0|[1-9]\d*)(\.\d{1,2})?$'
            example: "250000.00"

      responses:
        "200":
          description: Liste paginée des annonces publiées.
          headers:
            ETag:
              description: Identifiant de la représentation JSON.
              schema:
                type: string
            Cache-Control:
              description: Politique de cache HTTP public avec revalidation.
              schema:
                type: string
                example: "public, max-age=0, must-revalidate"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnonceResume"
                  pagination:
                    type: object
                    required: [page, limit, total, pages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer

        "304":
          description: La liste n'a pas changé depuis l'ETag fourni.
          headers:
            ETag:
              description: ETag de la représentation actuelle.
              schema:
                type: string
            Cache-Control:
              description: Politique de revalidation.
              schema:
                type: string

        "400":
          description: Paramètres de recherche invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      tags:
        - Annonces
      summary: Créer une annonce immobilière
      description: >
        Permet à un AGENT ou un ADMIN authentifié de créer une annonce.
        L'identifiant de l'auteur est récupéré depuis le JWT.
        Le statut initial est toujours BROUILLON.
      operationId: createAnnonce
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnonceInput"

      responses:
        "201":
          description: Annonce créée en brouillon.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnonceCreee"

        "400":
          description: Données de création invalides.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "413":
          description: Corps JSON trop volumineux.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: JWT absent, invalide ou expiré.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "403":
          description: Utilisateur authentifié sans rôle AGENT ou ADMIN.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "429":
          description: Limite de requêtes dépassée.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /annonces/miennes:
    get:
      tags:
        - Annonces
      summary: Lister mes annonces
      description: >
        Retourne les annonces appartenant à l'utilisateur
        authentifié, y compris les brouillons.
        Accessible uniquement aux rôles AGENT et ADMIN.
        L'identifiant du propriétaire est extrait du JWT.
        Sans filtre statut, les deux statuts sont inclus.

      operationId: getMesAnnonces

      security:
        - bearerAuth: []

      parameters:
        - name: page
          in: query
          description: Numéro de page.
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          description: Nombre d'annonces par page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - name: ville
          in: query
          description: Filtrer par ville.
          schema:
            type: string
            minLength: 1
            maxLength: 100

        - name: type
          in: query
          description: Type de transaction.
          schema:
            type: string
            enum: [VENTE, LOCATION]

        - name: prixMax
          in: query
          description: >
            Prix maximal sous forme de chaîne décimale non négative,
            avec au plus deux décimales.
          schema:
            type: string
            pattern: '^(0|[1-9]\d*)(\.\d{1,2})?$'
            example: "250000.00"

        - name: statut
          in: query
          description: Filtrer par statut de publication.
          schema:
            type: string
            enum: [BROUILLON, PUBLIE]

      responses:
        "200":
          description: Liste paginée des annonces du propriétaire.
          headers:
            Cache-Control:
              description: Données personnelles non stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnnonceDetail"
                  pagination:
                    type: object
                    required: [page, limit, total, pages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer

        "400":
          description: Paramètres de requête invalides.
          headers:
            Cache-Control:
              description: Données personnelles non stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: Authentification requise.
          headers:
            Cache-Control:
              description: Données personnelles non stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "403":
          description: Accès réservé aux agents et administrateurs.
          headers:
            Cache-Control:
              description: Données personnelles non stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /annonces/{id}:
    get:
      tags:
        - Annonces
      summary: Consulter le détail d'une annonce publiée
      description: >
        Les annonces publiées sont accessibles publiquement.
        Les brouillons sont accessibles uniquement à leur auteur ou aux administrateurs.
      operationId: getAnnonceById
      security:
        - {}
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'annonce.
          schema:
            type: string
            minLength: 1

      responses:
        "200":
          description: Détails de l'annonce publiée.
          headers:
            ETag:
              description: Identifiant de la représentation JSON.
              schema:
                type: string
            Cache-Control:
              description: |
                Politique de cache HTTP.
                Les annonces publiées sont publiques avec revalidation.
                Les brouillons ne doivent pas être mis en cache.
              schema:
                type: string
                examples:
                  - "public, max-age=0, must-revalidate"
                  - "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnonceDetail"

        "304":
          description: L'annonce n'a pas changé depuis l'ETag fourni.
          headers:
            ETag:
              description: ETag de la représentation actuelle.
              schema:
                type: string
            Cache-Control:
              description: Politique de revalidation.
              schema:
                type: string
                example: "public, max-age=0, must-revalidate"

        "400":
          description: Identifiant invalide.
          headers:
            Cache-Control:
              description: Les brouillons et les réponses d'erreur ne sont pas stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: Authentification requise ou invalide.
          headers:
            Cache-Control:
              description: Les brouillons et les réponses d'erreur ne sont pas stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "404":
          description: Annonce inexistante ou non accessible.
          headers:
            Cache-Control:
              description: Les brouillons et les réponses d'erreur ne sont pas stockables.
              schema:
                type: string
                example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    patch:
      tags:
        - Annonces
      summary: Modifier une annonce
      description: >
        Un agent peut modifier uniquement ses propres annonces.
        Un administrateur peut modifier toutes les annonces.
        Le propriétaire et le statut ne sont pas modifiables ici.
      operationId: updateAnnonce

      # JWT obligatoire : AGENT ou ADMIN.
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'annonce à modifier.
          schema:
            type: string
            minLength: 1
            maxLength: 100

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnonceInput"

      responses:
        "200":
          description: Annonce modifiée avec succès.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnonceModifiee"

        "400":
          description: Données de modification invalides.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: Authentification requise.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "403":
          description: Rôle insuffisant.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "404":
          description: Annonce inexistante ou inaccessible à cet agent.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      tags:
        - Annonces
      summary: Supprimer une annonce
      description: >
        Un agent peut supprimer uniquement ses propres annonces.
        Un administrateur peut supprimer toutes les annonces.
        La suppression est définitive et entraîne également
        la suppression des photos, questions, réponses et favoris
        associés, conformément aux relations Prisma.
      operationId: deleteAnnonce

      # Authentification JWT obligatoire.
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'annonce à supprimer.
          schema:
            type: string
            minLength: 1
            maxLength: 100

      responses:
        "204":
          description: Annonce supprimée avec succès.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"

        "400":
          description: Identifiant invalide.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: Authentification requise.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "403":
          description: Rôle insuffisant.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "404":
          description: Annonce inexistante ou inaccessible à cet agent.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /annonces/{id}/statut:
    patch:
      tags:
        - Annonces
      summary: Publier ou dépublier une annonce
      description: >
        Permet à un agent de publier ou dépublier ses propres annonces.
        Un administrateur peut modifier le statut de toutes les annonces.
        Si le statut demandé est déjà celui de l'annonce, aucune
        modification n'est effectuée dans la base de données.

      operationId: changeStatutAnnonce

      # Authentification JWT obligatoire : AGENT ou ADMIN.
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'annonce.
          schema:
            type: string
            minLength: 1
            maxLength: 100

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - statut
              properties:
                statut:
                  type: string
                  enum:
                    - BROUILLON
                    - PUBLIE
                  description: Nouveau statut de publication.

      responses:
        "200":
          description: Statut enregistré avec succès.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - statut
                  - auteurId
                  - updatedAt
                properties:
                  id:
                    type: string
                  statut:
                    type: string
                    enum: [BROUILLON, PUBLIE]
                  auteurId:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time

        "400":
          description: Identifiant ou statut invalide.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "401":
          description: Authentification requise.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "403":
          description: Rôle insuffisant.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "404":
          description: Annonce inexistante ou inaccessible à cet agent.
          headers:
            Cache-Control:
              description: Les réponses d'écriture ne sont pas stockables.
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"


# ──────────────────────────── AUTH ────────────────────────────

  /auth/login:
    post:
      tags:
        - Auth
      summary: Se connecter
      description: |
        Authentifie un utilisateur à partir de son email et de son mot de passe
        (vérifié avec Argon2) et retourne un JWT signé avec `JWT_SECRET`,
        valable 1 jour. Le payload du token contient `id` et `role`.
        Le même message d'erreur est renvoyé que l'email n'existe pas ou que
        le mot de passe soit incorrect, afin de ne pas révéler l'existence
        d'un compte. Cette route est publique et protégée par un rate limiter.
      operationId: login
      security: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: mohamed@example.com
              password: password123
      responses:
        "200":
          description: Connexion réussie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Email ou mot de passe incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: UNAUTHORIZED
                  message: Email ou mot de passe incorrect.
                  details: {}
        "429":
          description: Limite de tentatives de connexion atteinte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Trop de tentatives, réessayez plus tard
                  details: {}
        "500":
          description: Erreur serveur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Erreur interne du serveur
                  details: {}

# ────────────────────────── QUESTIONS ──────────────────────────

  /questions/annonce/{annonceId}:
    get:
      tags:
        - Questions
      summary: Lister les questions d'une annonce
      description: |
        Retourne les questions d'une annonce avec pagination, de la plus récente
        à la plus ancienne. Chaque question inclut son auteur (`id`, `name`)
        et sa réponse éventuelle.

        Règles d'accès :
        - **Annonce publiée** : accès public, aucun JWT nécessaire.
        - **Brouillon** : réservé à l'ADMIN ou à l'AGENT propriétaire de l'annonce
          (JWT obligatoire).

        Le JWT est facultatif : s'il est fourni, il est vérifié et l'identité
        est utilisée pour appliquer les règles ci-dessus. Pour ne pas révéler
        l'existence d'un brouillon, une annonce inexistante ou inaccessible
        renvoie la même erreur 404.
      operationId: listQuestionsByAnnonce
      security:
        - {}              # visiteur anonyme
        - bearerAuth: []  # authentification facultative
      parameters:
        - name: annonceId
          in: path
          required: true
          description: Identifiant de l'annonce.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Liste paginée des questions.
          content:
            application/json:
              schema:
                type: object
                required: [status, data, pagination]
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestionDetail"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Annonce inexistante ou inaccessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: NOT_FOUND
                  message: Annonce introuvable
                  details: {}

  /questions/create:
    post:
      tags:
        - Questions
      summary: Poser une question sur une annonce
      description: |
        Crée une question sur une annonce **publiée**.
        L'auteur est déterminé à partir du JWT, jamais à partir du body.
        Les champs inconnus dans le body sont refusés (400).
        Cette route est protégée par un rate limiter.
      operationId: createQuestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionInput"
            example:
              texte: Le logement est-il disponible dès le mois prochain ?
              annonceId: clw3f8k2a0001annonce1234567
      responses:
        "201":
          description: Question créée avec succès.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Question posée avec succès
                  data:
                    $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Annonce inexistante ou non publiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: NOT_FOUND
                  message: Annonce introuvable
                  details: {}
        "429":
          description: Limite de questions atteinte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Trop de tentatives, réessayez plus tard
                  details: {}

  /questions/{id}:
    delete:
      tags:
        - Questions
      summary: Supprimer une question
      description: |
        Supprime une question.
        Seul l'auteur de la question ou un ADMIN peut effectuer cette action.
      operationId: deleteQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant CUID de la question.
          schema:
            type: string
          example: clw3f8k2a0002question123456
      responses:
        "200":
          description: Question supprimée.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Question supprimée avec succès
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Question introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: NOT_FOUND
                  message: Question introuvable
                  details: {}

# ──────────────────────────── USERS ────────────────────────────

  /users/getAll:
    get:
      tags:
        - Users
      summary: Récupérer tous les utilisateurs
      description: |
        Retourne la liste paginée des utilisateurs.
        Accès réservé aux administrateurs (ADMIN).
      operationId: getAllUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Liste des utilisateurs récupérée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}:
    get:
      tags:
        - Users
      summary: Récupérer un utilisateur par son ID
      description: |
        Retourne le profil d'un utilisateur avec ses annonces,
        ses favoris et les statistiques associées.
        Un utilisateur peut consulter son propre profil.
        Un ADMIN peut consulter tous les profils.
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Profil utilisateur récupéré.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Users
      summary: Modifier un utilisateur
      description: |
        Modifie les informations d'un utilisateur.
        Seul le propriétaire du compte ou un ADMIN peut effectuer cette action.
        Seul un ADMIN peut modifier le rôle d'un utilisateur.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
            example:
              name: Mohamed Sanogo
              email: mohamed@example.com
      responses:
        "200":
          description: Utilisateur mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Utilisateur mis à jour avec succès
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Users
      summary: Supprimer un utilisateur
      description: |
        Supprime un compte utilisateur.
        Seul le propriétaire du compte ou un ADMIN peut effectuer cette action.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Utilisateur supprimé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Utilisateur supprimé avec succès
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/register:
    post:
      tags:
        - Users
      summary: Inscrire un nouvel utilisateur
      description: |
        Crée un compte utilisateur.
        Le mot de passe est haché avec Argon2 avant stockage.
        Le rôle est automatiquement défini à USER.
        Cette route est publique et protégée par un rate limiter.
      operationId: registerUser
      security: []  # Route publique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
            example:
              name: Mohamed Sanogo
              email: mohamed@example.com
              password: password123
      responses:
        "201":
          description: Utilisateur créé avec succès.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Utilisateur créé avec succès
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Adresse email déjà utilisée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: CONFLICT
                  message: Cet email est déjà utilisé
                  details:
                    email:
                      - Cet email est déjà associé à un autre compte.
        "429":
          description: Limite de tentatives d'inscription atteinte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Trop de tentatives, réessayez plus tard
                  details: {}

  /favoris:
    post:
      tags:
        - Favoris
      summary: Ajouter une annonce aux favoris
      operationId: favorisPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavorisPostRequest"
      responses:
        "201":
          description: Annonce ajoutée aux favoris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriResponse"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Utilisateur non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Annonce introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Favori déjà existant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /favoris/{annonceId}:
    delete:
      tags:
        - Favoris
      summary: Supprimer une annonce des favoris
      operationId: favorisAnnonceIdDelete
      security:
        - bearerAuth: []
      parameters:
        - name: annonceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favori supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriDeleteResponse"
        "400":
          description: Identifiant invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Utilisateur non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Favori introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

# ────────────────────────── RÉPONSES ──────────────────────────
 
  /reponses/create:
    post:
      tags:
        - Reponses
      summary: Répondre à une question
      description: |
        Crée la réponse à une question.
        Seul un ADMIN ou l'AGENT propriétaire de l'annonce concernée peut répondre.
        L'auteur de la réponse est déterminé à partir du JWT, jamais à partir du body.
        Les champs inconnus dans le body sont refusés (400).
        Une question n'a qu'une seule réponse : une seconde tentative renvoie 409.
      operationId: createReponse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReponseInput"
            example:
              texte: Oui, le logement est disponible dès le 1er du mois prochain.
              questionId: clw3f8k2a0002question123456
      responses:
        "201":
          description: Réponse créée avec succès.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Réponse ajoutée avec succès
                  data:
                    $ref: "#/components/schemas/Reponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Question introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: NOT_FOUND
                  message: Question introuvable
                  details: {}
        "409":
          description: Cette question a déjà une réponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: CONFLICT
                  message: Cette question a déjà une réponse
                  details: {}
 
  /reponses/question/{questionId}:
    get:
      tags:
        - Reponses
      summary: Consulter la réponse d'une question
      description: |
        Retourne la réponse d'une question, avec son auteur (`id`, `name`).
 
        Règles d'accès, identiques à celles des questions :
        - **Annonce publiée** : réponse consultable.
        - **Brouillon** : réservé à l'ADMIN ou à l'AGENT propriétaire de l'annonce.
 
        Pour ne pas révéler l'existence d'un brouillon, une question inexistante,
        une question sans réponse et un accès refusé renvoient la même erreur 404.
      operationId: getReponseByQuestion
      # Le routeur exige actuellement un JWT.
      # Si l'accès devient public (authentification facultative, comme
      # GET /questions/annonce/{annonceId}), remplacer par :
      #   security:
      #     - {}
      #     - bearerAuth: []
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          description: Identifiant CUID de la question.
          schema:
            type: string
          example: clw3f8k2a0002question123456
      responses:
        "200":
          description: Réponse de la question.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/ReponseDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Question, réponse introuvable ou accès refusé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: NOT_FOUND
                  message: Réponse introuvable
                  details: {}
 
  /reponses/{id}:
    delete:
      tags:
        - Reponses
      summary: Supprimer une réponse
      description: |
        Supprime une réponse.
        Seul l'auteur de la réponse ou un ADMIN peut effectuer cette action.
      operationId: deleteReponse
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant CUID de la réponse.
          schema:
            type: string
          example: clw3f8k2a0003reponse123456
      responses:
        "200":
          description: Réponse supprimée.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Réponse supprimée avec succès
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Réponse introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: NOT_FOUND
                  message: Réponse introuvable
                  details: {}
 
 
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Identifiant CUID de l'utilisateur.
      schema:
        type: string
      example: clw3f8k2a0000qwerty1234567

    Page:
      name: page
      in: query
      required: false
      description: Numéro de page (à partir de 1).
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Nombre d'éléments par page (maximum 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  responses:
    Unauthorized:
      description: Authentification requise.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: UNAUTHORIZED
              message: Authentification requise
              details: {}

    Forbidden:
      description: Accès refusé.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: FORBIDDEN
              message: Accès refusé
              details: {}

    NotFound:
      description: Ressource introuvable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: NOT_FOUND
              message: Utilisateur introuvable
              details: {}

    ValidationError:
      description: Données ou paramètres invalides.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: VALIDATION_ERROR
              message: Données invalides
              details:
                id:
                  - Identifiant invalide
  schemas:
    # Données acceptées pour PATCH /annonces/{id}.
    # Aucun champ n'est obligatoire individuellement,
    # mais au moins un champ doit être fourni.
    UpdateAnnonceInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        titre:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        type:
          type: string
          enum: [VENTE, LOCATION]
        typePropriete:
          type: string
          enum: [APPARTEMENT, MAISON, VILLA, STUDIO, LOFT]
        prix:
          type: string
          description: Prix strictement positif, au maximum deux décimales
          pattern: '^(?:[1-9][0-9]{0,9}(?:[.][0-9]{1,2})?|0[.](?:[1-9][0-9]?|0[1-9]))$'
          example: "400000.00"
        ville:
          type: string
          minLength: 1
          maxLength: 100
          description: Ville du bien immobilier (100 caractères maximum)
          example: Le Havre
        surface:
          type: integer
          minimum: 9
          maximum: 2000
        chambres:
          type: integer
          minimum: 0
          maximum: 20
        etat:
          type: string
          enum: [DISPONIBLE, LOUE, VENDU]
        dateDisponibilite:
          type: string
          format: date-time

    # Réponse simplifiée : les autres propriétés
    # de l'annonce peuvent également être renvoyées.
    AnnonceModifiee:
      type: object
      required: [id, statut, auteurId]
      properties:
        id:
          type: string
        statut:
          type: string
          enum: [BROUILLON, PUBLIE]
        auteurId:
          type: string
        titre:
          type: string
        prix:
          type: string
        ville:
          type: string
        updatedAt:
          type: string
          format: date-time

    CreateAnnonceInput:
      type: object
      additionalProperties: false
      required:
        - titre
        - description
        - type
        - typePropriete
        - prix
        - ville
        - surface
        - chambres
      properties:
        titre:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        type:
          type: string
          enum: [VENTE, LOCATION]
        typePropriete:
          type: string
          enum: [APPARTEMENT, MAISON, VILLA, STUDIO, LOFT]
        prix:
          type: string
          description: Prix strictement positif, au maximum deux décimales
          pattern: '^(?:[1-9][0-9]{0,9}(?:[.][0-9]{1,2})?|0[.](?:[1-9][0-9]?|0[1-9]))$'
          example: "400000.00"
        ville:
          type: string
          minLength: 1
          maxLength: 100
          description: Ville du bien immobilier (100 caractères maximum)
          example: Le Havre
        surface:
          type: integer
          minimum: 9
          maximum: 2000
        chambres:
          type: integer
          minimum: 0
          maximum: 20
        etat:
          type: string
          enum: [DISPONIBLE, LOUE, VENDU]
        dateDisponibilite:
          type: string
          format: date-time
          description: Date ISO 8601 avec fuseau horaire.

    AnnonceCreee:
      allOf:
        - $ref: "#/components/schemas/AnnonceResume"
        - type: object
          required:
            - description
            - statut
            - dateDisponibilite
            - updatedAt
            - auteurId
            - photos
          properties:
            description:
              type: string
            statut:
              type: string
              enum: [BROUILLON]
            surface:
              type: integer
            chambres:
              type: integer
            dateDisponibilite:
              type: [string, "null"]
              format: date-time
            updatedAt:
              type: string
              format: date-time
            auteurId:
              type: string
              description: Identifiant de l'utilisateur authentifié.
            photos:
              type: array
              items:
                type: object
                required: [id, url, alt, annonceId]
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  alt:
                    type: string
                  annonceId:
                    type: string

    AnnonceDetail:
      allOf:
        - $ref: "#/components/schemas/AnnonceResume"
        - type: object
          required:
            - statut
            - auteurId
            - photos
            - updatedAt
          properties:
            description:
              type: [string, "null"]
            statut:
              type: string
              enum: [BROUILLON, PUBLIE]
            dateDisponibilite:
              type: [string, "null"]
              format: date-time
            updatedAt:
              type: string
              format: date-time
            auteurId:
              type: string
            photos:
              type: array
              items:
                type: object
                required: [id, url, alt, annonceId]
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  alt:
                    type: string
                  annonceId:
                    type: string

    AnnonceResume:
      type: object
      required:
        - id
        - titre
        - type
        - typePropriete
        - etat
        - prix
        - ville
        - surface
        - chambres
        - createdAt
      properties:
        id:
          type: string
        titre:
          type: string
        type:
          type: string
          enum: [VENTE, LOCATION]
        typePropriete:
          type: string
        etat:
          type: string
        prix:
          type: string
          description: Prix décimal sérialisé en chaîne.
          examples: ["250000.00"]
        ville:
          type: string
        surface:
          type: [number, "null"]
        chambres:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
# ── Auth---
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mohamed@example.com
        password:
          type: string
          minLength: 1
          format: password
          example: password123

    LoginResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Connexion réussie
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
              description: JWT signé (expire au bout de 1 jour), à envoyer dans `Authorization Bearer`.
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              $ref: "#/components/schemas/User"

# ── Questions ──

    Question:
      type: object
      required: [id, texte, createdAt, auteurId, annonceId]
      properties:
        id:
          type: string
          example: clw3f8k2a0002question123456
        texte:
          type: string
          example: Le logement est-il disponible dès le mois prochain ?
        createdAt:
          type: string
          format: date-time
        auteurId:
          type: string
          description: Identifiant de l'auteur (issu du JWT).
        annonceId:
          type: string

    QuestionDetail:
      allOf:
        - $ref: "#/components/schemas/Question"
        - type: object
          required: [auteur, reponse]
          properties:
            auteur:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            reponse:
              description: Réponse à la question, `null` si aucune réponse n'a été donnée.
              oneOf:
                - $ref: "#/components/schemas/Reponse"
                - type: "null"

    CreateQuestionInput:
      type: object
      additionalProperties: false
      required: [texte, annonceId]
      properties:
        texte:
          type: string
          minLength: 1
          description: Texte de la question (espaces de début et de fin retirés).
        annonceId:
          type: string
          minLength: 1
          description: Identifiant de l'annonce publiée concernée.

# ── Réponses ──
 
    Reponse:
      type: object
      required: [id, texte, createdAt, updatedAt, questionId, auteurId]
      properties:
        id:
          type: string
          example: clw3f8k2a0003reponse123456
        texte:
          type: string
          example: Oui, le logement est disponible dès le 1er du mois prochain.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        questionId:
          type: string
          description: Identifiant de la question (une seule réponse par question).
        auteurId:
          type: string
          description: Identifiant de l'auteur de la réponse (issu du JWT).
 
    ReponseDetail:
      allOf:
        - $ref: "#/components/schemas/Reponse"
        - type: object
          required: [auteur]
          properties:
            auteur:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
 
    CreateReponseInput:
      type: object
      additionalProperties: false
      required: [texte, questionId]
      properties:
        texte:
          type: string
          minLength: 1
          description: Texte de la réponse (espaces de début et de fin retirés).
        questionId:
          type: string
          minLength: 1
          description: Identifiant CUID de la question à laquelle on répond.

# ── Users ──

    User:
      type: object
      properties:
        id:
          type: string
          example: clw3f8k2a0000qwerty1234567
        name:
          type: string
          example: Mohamed Sanogo
        email:
          type: string
          format: email
          example: mohamed@example.com
        role:
          type: string
          enum: [USER, AGENT, ADMIN]
          example: USER
        createdAt:
          type: string
          format: date-time
          example: "2026-10-20T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-22T15:30:00.000Z"

    UserSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, AGENT, ADMIN]
        createdAt:
          type: string
          format: date-time

    CreateUserInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          example: Mohamed Sanogo
        email:
          type: string
          format: email
          example: mohamed@example.com
        password:
          type: string
          minLength: 6
          format: password
          example: password123

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: Mohamed Sanogo
        email:
          type: string
          format: email
          example: mohamed@example.com
        role:
          type: string
          enum: [USER, AGENT, ADMIN]
          description: Seul un ADMIN peut modifier ce champ.

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/User"
            - type: object
              properties:
                annonces:
                  type: array
                  description: Annonces de l'utilisateur pour la page demandée.
                  items:
                    type: object
                    additionalProperties: true
                favoris:
                  type: array
                  description: Favoris de l'utilisateur pour la page demandée.
                  items:
                    type: object
                    additionalProperties: true
                pagination:
                  type: object
                  properties:
                    annonces:
                      $ref: "#/components/schemas/Pagination"
                    favoris:
                      $ref: "#/components/schemas/Pagination"
    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 50
        pages:
          type: integer
          example: 5

    FavorisPostRequest:
      type: object
      required:
        - annonceId
      properties:
        annonceId:
          type: string
          example: "cm123456789abcdef12345678"

    FavoriResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - id
            - userId
            - annonceId
          properties:
            id:
              type: string
              example: "cmfavori123456789abcdef"
            userId:
              type: string
              example: "cmuser123456789abcdef"
            annonceId:
              type: string
              example: "cmannonce123456789abcdef"

    FavoriDeleteResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Favori supprimé avec succès"

